name: Bug report
description: Describe a reproducible problem using invented data.
body:
  - type: markdown
    attributes:
      value: 'Use fictional examples only. Do not include credentials, calendars, private response links or saved databases. Report vulnerabilities privately via Security.'
  - type: textarea
    id: steps
    attributes:
      label: What happened, and how can we reproduce it?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Release, operating system and Node version
  - type: dropdown
    id: mode
    attributes:
      label: Operating mode
      options:
        - Local fictional demo
        - My own hosted installation
